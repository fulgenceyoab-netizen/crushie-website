<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>love you mwanah💪</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ffd6e8, #fff0f6);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 380px;
            padding: 35px 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.22);
        }

        .heart {
            font-size: 45px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        h1 {
            color: #ff4f9a;
            margin-bottom: 10px;
        }

        h2 {
            color: #333;
            margin-top: 25px;
        }

        p {
            color: #444;
            font-size: 17px;
            line-height: 1.5;
        }

        .buttons {
            margin-top: 25px;
            height: 80px;
            position: relative;
        }

        button {
            border: none;
            padding: 13px 28px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        #yesBtn {
            background: #ff4f9a;
            color: white;
            margin-right: 15px;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background: #ff2f86;
        }

        #noBtn {
            background: #eeeeee;
            color: #333;
            position: absolute;
        }

        #smallText {
            font-size: 14px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="heart">❤️</div>

        <h1>Hey My love <marquee>ukhty</marquee></h1>

        <p id="message">
            I have made this to express ma feelings to you, that i love you so much😍
        </p>

        <h2>Wanna hang out one more time?</h2>

        <div class="buttons">

            <button id="yesBtn">
                Yes 😊
            </button>

            <button id="noBtn">
                No 😅
            </button>

        </div>

        <p id="smallText">
            Kumbuka niko poa before you pick No😅
        </p>

    </div>


    <!-- ============================= -->
    <!--       JAVASCRIPT SECTION      -->
    <!-- ============================= -->

    <script>

        // Get the buttons and text from HTML
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const smallText = document.getElementById('smallText');

        // Count how many times the No button is approached
        let noCount = 0;


        // Function to move the No button
        function moveNoButton() {

            // Increase the No counter
            noCount++;


            // Get the maximum available screen width
            // and height for the button
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;


            // Generate random X and Y positions
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);


            // Change the No button position
            noBtn.style.position = "fixed";

            noBtn.style.left = `${randomX}px`;

            noBtn.style.top = `${randomY}px`;


            // Change the message depending
            // on how many times No has been approached

            if (noCount === 1) {

                smallText.textContent =
                    "Mbona unakimbilia No😅";

            } else if (noCount === 2) {

                smallText.textContent =
                    "finya yes 😅";

            } else if (noCount === 3) {

                smallText.textContent =
                    "achana na no😅";

            } else {

                smallText.textContent =
                    "No imejam, just pick yes😅";

            }

        }


        // When the mouse moves over the No button,
        // call the moveNoButton function
        noBtn.addEventListener("mouseover", moveNoButton);


        // For mobile phones and touch screens
        noBtn.addEventListener("touchstart", moveNoButton);


        // When the Yes button is clicked
        yesBtn.addEventListener("click", () => {

            // Replace the whole page with the success message
            document.body.innerHTML = `

                <div class="card">

                    <div class="heart">
                        ❤️
                    </div>

                    <h1>
                        Yeah! 😊
                    </h1>

                    <p>
                        Najua you liked me too!
                    </p>

                    <h2>
                        <i>so unanipea lini?🫣</i>
                    </h2>

                </div>

            `;

        });

    </script>

</body>

</html>
